<div class="container" align="center">
    <h1>CALCULATOR</h1>
    <div class="form">
        <div class="calc">
            <h1 id="answer"><marquee>Hello Calculator</marquee></h1>
            <input type="text" id="answer" name="screen"><br>
            <input type="button" value="7" onclick="forms.screen.value=&#39;7&#39;">

        </div>
